# Corpus configuration for the emotion-concepts replication.
#
# emotions and topics are taken VERBATIM from arXiv:2604.07729, appendix
# sections "Full list of emotions" (171 emotions) and "Dataset
# generation" (100 topics). Using the paper's own stimulus set removes
# a degree of freedom: if the replication fails, it is not because the topics or
# emotion labels were chosen badly.
#
# The prompts live in src/core/prompts.py, also from the appendix. The critical
# one forbids the model from naming the emotion — that is what stops a
# difference-of-means from learning the emotion WORD instead of the concept.
# 'mentions_emotion' measures compliance and is the first dataset health check.
#
# 171 emotions x 100 topics is far beyond a laptop run
# (17100 pairs). Subset with the CLI:
#   generate_corpus.py --emotions joy,sadness,anger --max-topics 25
#
#   emotions   one shard and one emotion vector each
#   topics     the variation that averages surface features away, and the
#              train/test split axis
#   intensity  graded ladders (held out) — severity rises with 'level'
#   implicit   scenarios that evoke without naming (held out)
#
# HARD CONSTRAINT on intensity and implicit: no emotion word may appear in any
# text, for any emotion. Verify with mentions_emotion, not by eye.
#
# NOTE: this is a hand-edited INPUT living in the dataset folder, which
# otherwise holds generated output. Do not 'rm -rf' the folder.

