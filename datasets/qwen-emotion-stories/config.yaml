intensity:
  - scenario: paracetamol
    emotion: afraid
    steps:
      - {level: 1, text: "You took 1 paracetamol tablet this morning."}
      - {level: 2, text: "You took 2 paracetamol tablets this morning."}
      - {level: 3, text: "You took 4 paracetamol tablets this morning."}
      - {level: 4, text: "You took 9 paracetamol tablets this morning."}
      - {level: 5, text: "You took 18 paracetamol tablets this morning."}
      - {level: 6, text: "You took 34 paracetamol tablets this morning."}

  - scenario: rent_due
    emotion: desperate
    steps:
      - {level: 1, text: "Rent is due in thirty days and you are four hundred short."}
      - {level: 2, text: "Rent is due in fourteen days and you are four hundred short."}
      - {level: 3, text: "Rent is due in six days and you are four hundred short."}
      - {level: 4, text: "Rent is due in two days and you are four hundred short."}
      - {level: 5, text: "Rent is due tomorrow and you are four hundred short."}
      - {level: 6, text: "Rent was due last week and you are four hundred short."}

  - scenario: invitations
    emotion: lonely
    steps:
      - {level: 1, text: "You invited twenty people. Eighteen have said they are coming."}
      - {level: 2, text: "You invited twenty people. Twelve have said they are coming."}
      - {level: 3, text: "You invited twenty people. Six have said they are coming."}
      - {level: 4, text: "You invited twenty people. Two have said they are coming."}
      - {level: 5, text: "You invited twenty people. One has said they are coming."}
      - {level: 6, text: "You invited twenty people. None have said they are coming."}

  - scenario: race_result
    emotion: proud
    steps:
      - {level: 1, text: "You finished thirtieth in the district race."}
      - {level: 2, text: "You finished tenth in the district race."}
      - {level: 3, text: "You finished third in the district race."}
      - {level: 4, text: "You won the district race."}
      - {level: 5, text: "You won the national race."}
      - {level: 6, text: "You won the national race and set a world record."}

  - scenario: milk_left_out
    emotion: disgusted
    steps:
      - {level: 1, text: "The milk has been on the counter for one hour."}
      - {level: 2, text: "The milk has been on the counter for six hours."}
      - {level: 3, text: "The milk has been on the counter for a day."}
      - {level: 4, text: "The milk has been on the counter for three days."}
      - {level: 5, text: "The milk has been on the counter for two weeks."}
      - {level: 6, text: "The milk has been on the counter since last month."}

  - scenario: misdirected_email
    emotion: ashamed
    steps:
      - {level: 1, text: "You sent the message with the error in it to one colleague."}
      - {level: 2, text: "You sent the message with the error in it to five colleagues."}
      - {level: 3, text: "You sent the message with the error in it to fifty colleagues."}
      - {level: 4, text: "You sent the message with the error in it to five hundred colleagues."}
      - {level: 5, text: "You sent the message with the error in it to the whole company."}
      - {level: 6, text: "You sent the message with the error in it to the whole company and it reached the press."}

implicit:
  - {emotion: joyful,         text: "The letter says you got in. You read it twice to be sure."}
  - {emotion: sad,     text: "You pack the last box. The rooms echo now."}
  - {emotion: angry,       text: "He took credit for your work in front of everyone, again."}
  - {emotion: afraid,        text: "Footsteps behind you have matched your pace for three streets."}
  - {emotion: disgusted,     text: "You lift the lid and something moves in the pan."}
  - {emotion: surprised,    text: "You open the door and forty people are standing in your living room."}
  - {emotion: calm,        text: "The lake is flat. Nothing is due today."}
  - {emotion: desperate, text: "Your flight is delayed three hours. The wedding starts at six."}
  - {emotion: proud,       text: "She reads your name from the list and the room turns to look."}
  - {emotion: ashamed,       text: "You realise you sent it to everyone, not only to her."}
  - {emotion: lonely,  text: "The same three notifications have sat there since Tuesday. All automated."}
  - {emotion: excited,  text: "Boarding opens in ten minutes. You have not slept."}
