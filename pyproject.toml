[project]
name = "emotion-concepts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "beartype>=0.22.9",
    "black>=26.5.1",
    "dataframe-image>=0.2.7",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "impossible",
    "impossiblebench",
    "inspect-ai>=0.3.263",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "openai>=3.13.0",
    "polars>=1.44.1",
    "python-dotenv>=1.2.3",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformer-lens>=3.8.1",
    "transformers>=5.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.uv.sources]
impossiblebench = { git = "https://github.com/safety-research/impossiblebench", rev = "061dc3dce6a9" }
impossible = { path = "../impossible", editable = true }
